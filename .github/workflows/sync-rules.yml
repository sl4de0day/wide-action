name: Sync Wide Rules Bundle

on:
  repository_dispatch:
    types: [wide-rules-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wide-action
        uses: actions/checkout@v4

      - name: Checkout upstream wide-rules
        uses: actions/checkout@v4
        with:
          repository: sl4de0day/wide-rules
          ref: main
          path: .wide-rules-upstream

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sync Embedded Bundle, Test, and Rebuild Action
        env:
          WIDE_RULES_DIST_DIR: .wide-rules-upstream/dist
        run: |
          npm ci
          npm run sync:bundle
          rm -rf .wide-rules-upstream
          npm test
          npm run build

      - name: Open Pull Request for Updated Bundle
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(bundle): sync latest wide-rules and OSV advisories"
          title: "chore(bundle): sync latest rules and OSV advisories"
          body: "Automated update triggered by wide-rules changes, verified with npm test and npm run build."
          branch: chore/sync-wide-rules
          delete-branch: true

      - name: Auto-Merge Updated Bundle PR
        id: merge_pr
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --delete-branch || gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --auto --squash --delete-branch

      - name: Update v1 Release Tag
        if: steps.merge_pr.outcome == 'success'
        run: |
          git config user.name "wide-rules-bot"
          git config user.email "wide-rules-bot@users.noreply.github.com"
          git fetch origin main --tags
          git tag -f v1 origin/main
          git push origin refs/tags/v1 --force
