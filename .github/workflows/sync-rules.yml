name: Sync Wide Rules Bundle

on:
  repository_dispatch:
    types: [wide-rules-updated]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: wide-action-bundle-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  sync-bundle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wide-action
        uses: actions/checkout@v7

      - name: Checkout upstream wide-rules
        uses: actions/checkout@v7
        with:
          repository: sl4de0day/wide-rules
          ref: main
          path: .wide-rules-upstream

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Sync Embedded Bundle, Test, and Rebuild Action
        env:
          WIDE_RULES_DIST_DIR: .wide-rules-upstream/dist
        run: |
          npm ci
          npm run sync:bundle
          rm -rf .wide-rules-upstream
          npm test
          npm run build

      - name: Open Pull Request for Updated Bundle
        id: create_pr
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.WIDE_ECOSYSTEM_TOKEN || secrets.GITHUB_TOKEN }}
          committer: wide-rules-bot <wide-rules-bot@users.noreply.github.com>
          author: wide-rules-bot <wide-rules-bot@users.noreply.github.com>
          commit-message: "chore(bundle): sync latest wide-rules and OSV advisories"
          title: "chore(bundle): sync latest rules and OSV advisories"
          body: "Automated update triggered by wide-rules changes, verified with npm test and npm run build."
          branch: chore/sync-wide-rules
          delete-branch: true

      - name: Auto-Merge Updated Bundle PR After Required Checks
        id: merge_pr
        if: steps.create_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create_pr.outputs.pull-request-number }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch
          for i in $(seq 1 80); do
            state=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            if [ "$state" = "MERGED" ]; then
              sha=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json mergeCommit -q .mergeCommit.oid)
              echo "merge_sha=$sha" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$state" = "CLOSED" ]; then
              echo "PR #$PR_NUMBER was closed without merging."
              exit 1
            fi
            sleep 30
          done
          echo "PR #$PR_NUMBER was not merged within 40 minutes; required checks may not have run."
          exit 1

      - name: Update v1 Release Tag
        if: steps.merge_pr.outputs.merge_sha != ''
        env:
          MERGE_SHA: ${{ steps.merge_pr.outputs.merge_sha }}
        run: |
          git fetch origin "$MERGE_SHA" --tags
          git tag -f v1 "$MERGE_SHA"
          git push origin refs/tags/v1 --force
